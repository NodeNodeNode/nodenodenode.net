# 学习资源。按"新人从上往下走一遍就能上手"的顺序排,不要按重要性排。
#
# lang: zh / en / de  → 会在条目上打一个语言标记。中文资源是本站的价值
#                       所在,外文的也列,但要让人一眼看出哪些要啃外语。

groups:
  - id: start
    title: 从这里开始
    items:
      - title: 下载 vvvv gamma
        href: https://vvvv.org/download
        lang: en
        note: 官方下载。个人学习和非商业用途免费。

      - title: 灰皮书 · 中文版
        href: https://thegraybook.nodenodenode.net/
        lang: zh
        note: >-
          官方文档 the gray book 的中文翻译站,覆盖编辑器、VL 语言特性
          和第三方库的用法。持续翻译中。

  - id: reference
    title: 深入查阅
    items:
      - title: the gray book(英文原版)
        href: https://thegraybook.vvvv.org/
        lang: en
        note: 官方文档。中文版没覆盖到的部分,回这里查。

      - title: vvvv 官方站
        href: https://vvvv.org/
        lang: en
        note: 版本发布、案例展示、活动信息。

      - title: 官方论坛
        href: https://forum.vvvv.org/
        lang: en
        note: 疑难杂症的最终去处,开发者本人也在上面回帖。

  # 购买链接只放豆瓣:页面稳定中立,上面自带各平台入口。
  # 不放孔夫子(是某一本二手书的具体 listing,卖掉就 404)和天猫
  # (带一长串追踪参数)。
  #
  # 封面存在 public/img/books/,按 ISBN 命名,和视频封面一样转灰度 ——
  # 全站只允许一个彩色(信号蓝)。缺封面的条目会自动退化成占位块。
  - id: books
    title: 书
    # 这句警告不能省。vvvv gamma 是 2020 年 4 月「reprogrammed from
    # scratch」重写的,而现存所有 vvvv 书都出在那之前 —— 讲的是 beta。
    # 新人照着书在 gamma 里做,patch 根本打不开。与其让他花几十上百块
    # 买回来才发现,不如写在前面。
    note: >-
      先说清楚:下面这些书讲的都是 vvvv beta,不是 gamma。gamma 是 2020 年
      从零重写的,两者的 patch 并不通用。书里的思路、硬件和追踪那部分仍然
      很有价值,但别指望照着做能在 gamma 里跑起来。
    items:
      - title: 原型界面—交互草图与 vvvv
        href: https://book.douban.com/subject/36180600/
        lang: zh
        isbn: '9787571325763'
        note: >-
          这本书在全世界唯一的译本 —— 原著除德文外只有中文版。南京艺术学院
          刘彦副教授译,江苏凤凰科学技术出版社 2022 年 5 月出版,
          ISBN 978-7-5713-2576-3。内容覆盖 vvvv、Arduino、各种追踪方式和
          显示技术,偏互动装置的硬件侧。

      - title: VVVV与新媒体艺术创作
        href: https://book.douban.com/subject/30184630/
        lang: zh
        isbn: '9787562190189'
        note: >-
          成都新媒体艺术家李琨编著,西南师范大学出版社 2018 年出版,396 页,
          ISBN 978-7-5621-9018-9,属「四川音乐学院电子音乐理论与技术丛书」。
          另一本中文 vvvv 书,视角偏新媒体艺术创作而不是纯技术。

      - title: Prototyping Interfaces(德文原版官网)
        href: https://prototypinginterfaces.com/
        lang: de
        note: >-
          上面第一本的原著,Jan Barth、Roman Stefan Grasy 等编著,336 页。
          这个网站不看德文也值得进:书里每个实例的 vvvv patch 文件都能免费
          下载,还附了各例子需要的 Arduino 驱动和软件链接。

      - title: vvvvook
        href: https://bnn.co.jp/products/9784861008009
        lang: ja
        isbn: '9784861008009'
        note: >-
          日本第一本 vvvv 入门书,副题是「为原型设计而学的可视化编程」。
          覆盖交互、2D/3D 动画、实时图形、audiovisual、数据可视化和
          物理计算。伊東実 / 星卓哉著,BNN 2014 年出版,B5 判 224 页全彩,
          ISBN 978-4-86100-800-9。

  - id: contribute
    title: 一起做点事
    items:
      - title: 参与文档翻译
        href: https://github.com/NodeNodeNode/thegraybookcn
        lang: zh
        note: >-
          翻译永远缺人手。认领一页、改一个错字都算数,
          不需要先证明自己懂 vvvv。

      - title: GitHub 组织
        href: https://github.com/NodeNodeNode
        lang: zh
        note: 社区的仓库都在这里,包括本站源码。
