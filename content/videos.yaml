# 视频教程 —— 按系列组织,不是一堆散片。
#
# 规则:
# * **B 站优先。** 每一集的主链接是 B 站,YouTube 作次要。墙内点不开
#   YouTube 是常态,主链接指过去等于没有。
# * **绝不用 iframe 嵌入,绝不引 B 站/YouTube 图床。** 封面跑
#   `npm run thumbs` 抓到本地,按 BV 号命名,不用手写路径。
# * `bilibili` / `youtube` 填**裸 ID**(BV 号 / YouTube videoId),不填完整
#   网址 —— 组件负责拼 URL,这样以后换域名格式只改一处。
# * 两个字段都可以留空:只在一个平台有的集数很常见,组件会自动只显示
#   有的那个。
#
# 顺序 = **建议的学习顺序,按内容难易排,不按作者分组**。
# 这个站是资源聚合站,不是谁的作品集 —— 把自己的排前面、别人的垫底,
# 观感上就变味了。序号由组件按数组下标自动生成,挪条目即可,不用手改。

# 渲染在章节标题下面。一句话挑明这是目录不是作品集。
intro: 本页收录 连节社 与 节点映射(TonyMark) 做的中文教程,按由浅入深排列。

# 渲染在视频板块末尾,两位创作者平级并列。
#
# 这里原来是一个「B 站全部视频」按钮,只指向连节社的空间 —— 一节创作者
# 中立的目录,底下挂一个只通向站长自己频道的实心按钮,等于把好不容易
# 拉平的观感又推回去。而且"全部视频"这个说法本身就不成立。
