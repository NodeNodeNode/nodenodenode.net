# 关于。
#
# 这一节要坦白两件事:站在墙外、群在墙内;以及这是个资源聚合站,
# 不是一个热闹的社区。与其让新人自己撞上,不如直接讲清楚 ——
# 含糊会显得不可信,吹嘘会让人来了就走。

title: 关于

body:
  - >-
    连节社是一个 vvvv gamma 的中文社区。做的事情很朴素:翻译文档、录中文教程、
    把想学的人聚到一起。

  - >-
    需要说明的是,维护这个站的人在海外。所以站点部署在境外,
    墙内访问可能偏慢甚至偶尔打不开 —— 备案需要境内主体,这条路走不通,
    暂时没有更好的解法。

  - >-
    这一页的作用是入口:把中文教程、翻译文档和联系方式收在一处,
    让你找到下一步该点哪里,然后就可以把它关掉了。
    微信群在,但很安静 —— 与其把它说成一个热闹的社区,不如老实讲:
    这里主要是资源,人是零散的。

  - >-
    之前有过一个论坛,因为维护成本高、参与的人少,已经停掉了。
    与其撑着一个没人说话的论坛,不如把力气放在内容上 ——
    教程和翻译放在那里,谁什么时候需要都还能用得上。

  - >-
    要找我的话:Discord 里 @ 管理员,或者直接在 GitHub 上开个 issue。
    这两个地方我都看得到 —— 站上写错了、链接失效了、想加自己的内容进来,
    都可以从这两处说。

# 需要人手的地方,写具体一点,别写"欢迎参与"
help_wanted:
  - 翻译灰皮书里还没动的章节
  - 把自己踩过的坑写成一篇短文
  - 在群里回答新人的问题
